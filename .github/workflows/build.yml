name: Build Shiza Client
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Unzip Sources Forcibly
      run: |
        unzip -o Shizasrc.zip -d project_folder || echo "Ignored symbols error"
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      
    - name: Build Jar File
      run: |
        cd project_folder
        chmod +x gradlew || true
        if [ -f gradlew ]; then ./gradlew build --no-daemon; else gradle build --no-daemon; fi
        
    - name: Upload Clean Jar
      uses: actions/upload-artifact@v4
      with:
        name: ShizaClient-JAR-File
        path: "**/build/libs/*.jar"
