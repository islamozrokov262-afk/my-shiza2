name: Build Shiza Client
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Unzip Sources Forcibly
      run: |
        unzip -o Shizasrc.zip -d project_folder || echo "Ignored symbols error"
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      
    - name: Build Jar File
      run: |
        cd project_folder
        chmod +x gradlew || true
        if [ -f gradle.properties ]; then
          sed -i 's|org.gradle.java.home=.*|org.gradle.java.home='"$JAVA_HOME"'|g' gradle.properties
        fi
        if [ -f gradlew ]; then ./gradlew build --no-daemon; else gradle build --no-daemon; fi
        
    - name: Create Release and Upload JAR
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        name: Clean Shiza Client Build
        files: "**/build/libs/*.jar"
